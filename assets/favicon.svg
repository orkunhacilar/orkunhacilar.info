<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="laptopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
        </linearGradient>
    </defs>
    <!-- Laptop screen -->
    <rect x="20" y="25" width="60" height="40" rx="3" fill="url(#laptopGradient)"/>
    <rect x="23" y="28" width="54" height="34" fill="#1a1a24"/>
    <!-- Code symbols on screen -->
    <text x="30" y="45" font-family="monospace" font-size="12" fill="#8b5cf6">&lt;/&gt;</text>
    <text x="52" y="45" font-family="monospace" font-size="12" fill="#ec4899">{}</text>
    <!-- Laptop base -->
    <path d="M 10 65 L 20 65 L 20 67 L 80 67 L 80 65 L 90 65 L 95 75 L 5 75 Z" fill="url(#laptopGradient)"/>
    <!-- Keyboard indicator -->
    <circle cx="50" cy="70" r="1.5" fill="#8b5cf6" opacity="0.8"/>
</svg>